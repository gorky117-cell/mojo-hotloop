[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-hotloop"
version = "0.1.0"
description = "Transparent AOT acceleration of Python hot loops using Mojo shared libraries"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "Gaurav Kumar Singh" }
]
keywords = [
    "mojo",
    "performance",
    "compiler",
    "jit",
    "aot",
    "acceleration",
    "transpiler",
    "native",
    "hotloop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
numpy = [
    "numpy>=1.24",
]
dev = [
    "numpy>=1.24",
]

[project.urls]
"Homepage" = "https://github.com/gorky117-cell/mojo-hotloop"
"Bug Tracker" = "https://github.com/gorky117-cell/mojo-hotloop/issues"
"Changelog" = "https://github.com/gorky117-cell/mojo-hotloop/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/gorky117-cell/mojo-hotloop/tree/main/docs"

[project.scripts]
hotloop = "hotloop.cli:main"

[tool.setuptools.packages.find]
include = ["hotloop*"]
